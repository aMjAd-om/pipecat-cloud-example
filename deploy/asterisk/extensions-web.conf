; Append these private contexts to the existing host config/extensions.conf.
; Do not include web-dialer from any SIP context. AMI is loopback only.
[web-dialer]
exten => _XXXXXXXX,1,NoOp(Web operator outbound call)
 same => n,GotoIf($["${REGEX("^[a-f0-9]{32}$" ${WEB_CALL_ID})}" != "1"]?reject)
 same => n,GotoIf($["${EXTEN:0:6}" = "211308"]?reject)
 same => n,GotoIf($["${REGEX("^[0-9]{2,4}$" ${WEB_MAX_SECONDS})}" != "1"]?reject)
 same => n,GotoIf($[${WEB_MAX_SECONDS}<30 | ${WEB_MAX_SECONDS}>3600]?reject)
 same => n,Set(TIMEOUT(absolute)=$[${WEB_MAX_SECONDS}+35])
 same => n,Set(CALLERID(all)=21130800)
 same => n,Set(CALLERID(num-pres)=allowed_not_screened)
 same => n,Dial(PJSIP/${EXTEN}@omantel-primary,30,iI)
 same => n,Hangup()
 same => n(reject),Hangup(21)
exten => _.,1,Hangup(1)
exten => s,1,Hangup(1)
exten => i,1,Hangup(1)
exten => t,1,Hangup(16)

[from-web-agent]
exten => s,1,NoOp(Connect answered outbound call to agent)
 same => n,GotoIf($["${REGEX("^[a-f0-9]{32}$" ${WEB_CALL_ID})}" != "1"]?reject)
 same => n,Set(TIMEOUT(absolute)=${WEB_MAX_SECONDS})
 same => n,Dial(WebSocket/pipecat/c(slin16)f(json)v(call_id=${WEB_CALL_ID}),30)
 same => n,Hangup()
 same => n(reject),Hangup(21)
