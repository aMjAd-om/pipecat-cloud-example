[project]
name = "azure-voice-agent-local"
version = "0.1.0"
description = "Asterisk telephone agent with a web dialer and live transcripts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # The azure extra pins the affected 1.42.x SDK; install Speech directly below.
    "pipecat-ai[openai,silero]==0.0.72",
    "azure-cognitiveservices-speech~=1.48.2",
    "openai~=1.70.0",
    "httpx~=0.28.1",
    "python-dotenv~=1.0.1",
    "fastapi~=0.115.6",
    "uvicorn~=0.34.0",
    "websockets~=13.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
voice-agent = "voice_agent.api.app:run"
survey-chat = "voice_agent.api.survey_chat:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_agent = ["agents/*/agent.json", "agents/*/prompt.md", "context/*.json"]
